# Throwaway database for ops/legacy-hotfix/verify.sh.
# Project name: sotfv2-hotfix. Data lives in tmpfs and disappears on `down`.
name: sotfv2-hotfix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sotf_hotfix
      POSTGRES_USER: sotf
      # Local, loopback-only, ephemeral database: no password needed.
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    ports:
      - "127.0.0.1:${HOTFIX_PG_PORT:-27440}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotf -d sotf_hotfix"]
      interval: 1s
      timeout: 3s
      retries: 30
