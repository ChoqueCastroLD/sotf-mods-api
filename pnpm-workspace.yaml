# pnpm 12 workspace configuration (PLAN §2.2, §2.4, §9.1, §12.1).
# pnpm 12 reads every non-auth setting from this file; `.npmrc` only carries registry settings.
#
# Rules for work packages:
# - Every dependency is referenced as `catalog:` (or `catalog:<name>`) from package.json files.
# - The catalog already pins every dependency of PLAN §2.2 to an exact version. A WP that needs a
#   new dependency pins the exact version in its own package.json and records it in
#   docs/backlog/<WP-ID>.md so the integrator can promote it to this catalog.

packages:
  - apps/*
  - packages/*
  - tooling/*
  - e2e

# Supply chain (PLAN §9.1): never install versions younger than 24 h ...
minimumReleaseAge: 1440
# ... except these exact versions: PLAN §2.2 pins them and they (or the @sentry/* packages they
# pin exactly) were published less than 24 h before the scaffold (2026-09-29). Entries are
# version-scoped, so any future bump is still subject to the 24 h rule. Safe to delete after
# 2026-09-30T20:00Z, once every entry is older than 24 h.
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1142.0'
  - '@aws-sdk/s3-request-presigner@3.1142.0'
  - '@sentry/astro@11.1.0'
  - '@sentry/browser@11.1.0'
  - '@sentry/browser-utils@11.1.0'
  - '@sentry/bundler-plugins@11.1.0'
  - '@sentry/core@11.1.0'
  - '@sentry/feedback@11.1.0'
  - '@sentry/node@11.1.0'
  - '@sentry/opentelemetry@11.1.0'
  - '@sentry/react@11.1.0'
  - '@sentry/replay@11.1.0'
  - '@sentry/replay-canvas@11.1.0'
  - '@sentry/server-runtime-injection@11.1.0'
  - '@sentry/server-utils@11.1.0'
  - '@testcontainers/postgresql@12.2.0'
  - 'testcontainers@12.2.0'

# Dependency build scripts are denied unless explicitly allowed here (pnpm 12 renamed
# `onlyBuiltDependencies` to `allowBuilds`; an unlisted build script fails the install).
allowBuilds:
  # Allowed (PLAN §9.1 allowlist).
  esbuild: true
  sharp: true
  '@node-rs/argon2': true
  '@node-rs/bcrypt': true
  # Denied: optional native accelerators / informational postinstalls pulled in by
  # testcontainers (docker-modem -> ssh2 -> cpu-features) and protobufjs. Not needed at runtime.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Security overrides for `pnpm audit --prod` (PLAN §9.1; WP-93 backlog). Both are transitive:
# undici via @scalar/fastify-api-reference > @scalar/openapi-parser > @scalar/json-magic, fflate
# 0.7.x via satori. Drop each entry once the parent ships the fixed range (`pnpm why <dep>`).
overrides:
  'undici@<7.29.1': 7.29.1
  'fflate@<0.7.5': 0.7.5
  # @lhci/cli (devDependency of apps/web, never shipped): tmp GHSA-52f5/ph9p, uuid < 11.1.1.
  'tmp@<0.2.7': 0.2.7
  'uuid@<11.1.1': 11.1.1

# extract-zip <= 2.0.1 (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3) has no patched release. It is only
# reachable through @lhci/cli > lighthouse > puppeteer-core (CI tooling that extracts browser
# archives it downloads itself), is not in any production image and is absent from `--prod`.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3

# `pnpm add <dep>` reuses the catalog entry when present and otherwise pins an exact version.
catalogMode: prefer
saveExact: true

