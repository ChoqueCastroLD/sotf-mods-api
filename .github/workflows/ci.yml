# CI for pull requests and pushes (PLAN §10.2). `pnpm ci:local` runs the same stages locally.
#
# Stages owned by work packages that have not landed yet are skipped with a notice
# (SOTF_OPTIONAL_TASKS=1 is the `--if-present` of PLAN §10.2); files that do not exist yet
# (e2e/package.json, tooling/lhci) gate their steps with hashFiles().
# Releases: release.yml (staging, on the release branch) and deploy.yml (production, v* tags).
name: ci

on:
  pull_request:
  push:
    # `v2` is the pre-cutover branch of the published repository (PLAN §14.4); it becomes `main`.
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: UTC
  CI: '1'
  FORCE_COLOR: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CACHE_DIR: .turbo/cache
  SOTF_OPTIONAL_TASKS: '1'

jobs:
  verify:
    name: verify (lint, checks, typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack, version from package.json#packageManager)
        run: corepack enable pnpm && pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 1 · biome ci
        run: pnpm exec biome ci .

      - name: 1b · actionlint (workflows) and shellcheck (ops scripts)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.10.0 -x \
            ops/docker/*.sh ops/coolify/*.sh ops/runbooks/deploy/*.sh tooling/scripts/*.sh

      - name: 2 · Dockerfile variants in sync
        run: ops/docker/sync-dockerfiles.sh --check

      - name: 2 · check:forbidden
        run: pnpm check:forbidden

      # PLAN §9.4: the repository becomes public, so a secret added and later removed in a PR
      # would still be published. Pull requests scan every line their commits add; pushes scan
      # the working tree (the weekly nightly job scans the whole history).
      - name: 2 · secrets-scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node tooling/scripts/secrets-scan.ts --history --rev="origin/${BASE_REF}..HEAD"
          else
            node tooling/scripts/secrets-scan.ts
          fi

      - name: 2b · generated files are committed and fresh
        run: |
          node tooling/scripts/gen.ts --check
          pnpm gen
          if [ -n "$(git status --porcelain -- . ':(exclude)pnpm-lock.yaml')" ]; then
            git status --porcelain -- . ':(exclude)pnpm-lock.yaml'
            echo "::error::Generated files are stale or uncommitted. Run 'pnpm gen' and commit the result."
            exit 1
          fi
          node tooling/scripts/gen-ownership.ts --check

      - name: 2c · check:ownership (wp/* pull requests)
        if: github.event_name == 'pull_request'
        env:
          SOTF_BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          wp="$(printf '%s' "$HEAD_REF" | grep -oE 'WP-[0-9A-Z]{2}$' || true)"
          node tooling/scripts/check-ownership.ts --optional ${wp:+"$wp"}

      - name: 3 · i18n:check
        run: pnpm i18n:check

      - name: 3b · brand assets are fresh
        run: pnpm --filter @sotf/brand check:assets

      - name: 4 · typecheck
        run: pnpm exec turbo run typecheck

      - name: 5 · unit tests
        run: pnpm exec turbo run test

      # The .NET UpdatesChecker checker of @sotf/legacy-contract (mcr.microsoft.com/dotnet/sdk:10.0,
      # ~900 MB, NuGet restore at build time) is built once through the GitHub Actions cache; its
      # `docker build` inside test:int / contract:legacy then only hits the local layer cache.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6 · .NET checker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tooling/legacy-contract/dotnet
          load: true
          push: false
          tags: sotfv2-legacy-contract-dotnet:local
          cache-from: type=gha,scope=legacy-contract-dotnet
          cache-to: type=gha,scope=legacy-contract-dotnet,mode=max

      # Testcontainers starts PostgreSQL 16 (and Mailpit/SeaweedFS where needed) on the runner's
      # Docker: @sotf/db, @sotf/migration-tools, @sotf/api, @sotf/worker and the legacy harness.
      - name: 6 · integration tests (Testcontainers)
        run: pnpm exec turbo run test:int

      - name: 7 · db:guard
        run: pnpm db:guard

      - name: 8 · contract:legacy
        run: pnpm contract:legacy

      - name: 9 · build
        run: pnpm exec turbo run build

  e2e:
    name: e2e + axe + visual, LHCI
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec turbo run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The images come from the GitHub Actions cache the images job fills (same scopes); the stack
      # reuses them: SOTF_*_IMAGE point ops/compose/e2e.yml at these tags.
      - name: 10 · build node image for the e2e stack
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/node.Dockerfile
          target: runtime
          load: true
          tags: sotfv2-e2e/sotf-node:ci
          cache-from: type=gha,scope=sotf-node

      - name: 10 · build tools image for the e2e stack (seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/node.Dockerfile
          target: tools
          load: true
          tags: sotfv2-e2e/sotf-tools:ci
          cache-from: |
            type=gha,scope=sotf-node
            type=gha,scope=sotf-tools

      - name: 10 · build web image for the e2e stack
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/web.Dockerfile
          load: true
          tags: sotfv2-e2e/sotf-web:ci
          cache-from: type=gha,scope=sotf-web

      - name: 10 · start the e2e stack (pg + seaweedfs + mailpit + seed + migrate + api + worker + web + edge)
        env:
          SOTF_NODE_IMAGE: sotfv2-e2e/sotf-node:ci
          SOTF_TOOLS_IMAGE: sotfv2-e2e/sotf-tools:ci
          SOTF_WEB_IMAGE: sotfv2-e2e/sotf-web:ci
        run: docker compose -p sotfv2-e2e -f ops/compose/e2e.yml up --no-build --detach --wait --wait-timeout 600

      - name: 10 · install Playwright browsers
        if: hashFiles('e2e/package.json') != ''
        run: pnpm --dir e2e exec playwright install --with-deps

      - name: 10 · e2e + axe + visual
        env:
          SOTF_E2E_BASE_URL: http://127.0.0.1:47521
          SOTF_E2E_API_URL: http://127.0.0.1:47501
          SOTF_E2E_MAILPIT_URL: http://127.0.0.1:47580
        run: pnpm e2e

      - name: 10b · legacy contract against the stack (shape mode on the dev seed)
        run: >-
          pnpm contract:legacy --base-url http://127.0.0.1:47501 --web-url http://127.0.0.1:47521
          --mode shape --dotnet on

      - name: 10 · stack logs
        if: failure()
        run: docker compose -p sotfv2-e2e -f ops/compose/e2e.yml logs --no-color --timestamps > e2e-stack.log || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: e2e-stack.log
          retention-days: 14

      - name: 10 · stop the e2e stack
        if: always()
        run: docker compose -p sotfv2-e2e -f ops/compose/e2e.yml down --volumes --remove-orphans

      - name: 11 · LHCI budgets
        run: pnpm lhci

      - name: Upload Playwright report
        if: failure() && hashFiles('e2e/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  images:
    name: docker images (build + inspection, no push)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 12 · build node image (api + worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/node.Dockerfile
          target: runtime
          load: true
          push: false
          tags: sotfv2-ci/sotf-node:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=sotf-node
          cache-to: type=gha,scope=sotf-node,mode=max

      - name: 12 · build tools image (operator CLIs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/node.Dockerfile
          target: tools
          load: false
          push: false
          cache-from: type=gha,scope=sotf-node
          cache-to: type=gha,scope=sotf-tools,mode=max

      - name: 12 · build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/web.Dockerfile
          load: true
          push: false
          tags: sotfv2-ci/sotf-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=sotf-web
          cache-to: type=gha,scope=sotf-web,mode=max

      - name: 12 · inspect (size budgets, non-root, no .env/dumps/TS sources)
        run: |
          ops/docker/inspect-image.sh sotfv2-ci/sotf-node:ci 230
          ops/docker/inspect-image.sh sotfv2-ci/sotf-web:ci 180

      - name: 12 · the images start and answer /healthz
        run: |
          set -euo pipefail
          secret="ci-only-$(openssl rand -hex 24)"
          docker run -d --name sotfv2-ci-web -p 127.0.0.1:47621:4321 \
            -e PUBLIC_SITE_URL=http://127.0.0.1:47621 -e SITE_ENV=development \
            -e INTERNAL_API_URL=http://127.0.0.1:9 sotfv2-ci/sotf-web:ci
          docker run -d --name sotfv2-ci-api -p 127.0.0.1:47601:3001 \
            -e PUBLIC_SITE_URL=http://127.0.0.1:47621 -e SITE_ENV=development \
            -e INTERNAL_SECRET="$secret" -e APP_SECRET="$secret" \
            -e DATABASE_URL=postgres://nobody:nothing@127.0.0.1:9/none sotfv2-ci/sotf-node:ci
          # The worker bundle links React (e-mail templates) at start-up: a broken dependency
          # layout only shows when the process starts. Without a database its health server never
          # turns ready (by design), so it only has to stay up.
          docker run -d --name sotfv2-ci-worker -e SOTF_ROLE=worker \
            -e PUBLIC_SITE_URL=http://127.0.0.1:47621 -e SITE_ENV=development \
            -e INTERNAL_SECRET="$secret" -e APP_SECRET="$secret" \
            -e DATABASE_URL=postgres://nobody:nothing@127.0.0.1:9/none sotfv2-ci/sotf-node:ci
          for url in http://127.0.0.1:47621/healthz http://127.0.0.1:47601/healthz; do
            for _ in $(seq 1 30); do curl --silent --fail "$url" && echo && continue 2; sleep 2; done
            docker logs sotfv2-ci-web || true
            docker logs sotfv2-ci-api || true
            echo "::error::$url did not answer 200"
            exit 1
          done
          if [ "$(docker inspect -f '{{.State.Running}}' sotfv2-ci-worker)" != "true" ]; then
            docker logs sotfv2-ci-worker || true
            echo "::error::the worker exited at start-up"
            exit 1
          fi

      - name: 12 · stop the containers
        if: always()
        run: docker rm -f sotfv2-ci-web sotfv2-ci-api sotfv2-ci-worker || true
